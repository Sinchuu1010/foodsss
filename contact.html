<!DOCTYPE html>
<html>
<head>
    <title>Foodie-World | Contact</title>

    <style>
       body {
            font-family: Arial;
            background: #F3F5F5;
            margin: 0;
        }

        .contact {
            width: 70%;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 3px 10px #bbb;
        }
		 h2 {
            text-align: center;
            color: #20A84A;
        }

        .info {
            font-size: 18px;
            line-height: 2;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 100px;
        }


      
        

        .contact {
            text-align: center;
            padding: 50px;
        }

        .contact h2 {
            color: maroon;
            margin-bottom: 25px;
        }

        .contact p {
            font-size: 18px;
            margin: 18px;
            color: #666;
        }

      
		
        button {
            background: #c65332;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
        }
		
  
	 /* ================= FOOTER ================= */

footer {
    background: #c65332;
    color: white;

    text-align: center;

    padding: 18px;

    margin-top: 20px;
}

footer p {
    margin: 5px;
    font-size: 14px;
}

</head>

<body>


    <div class="contact">

        <h2>CONTACT US</h2>

        <div class="info">
            <p>📍 Address: banglore,main Road</p>

            <p>✉ Email: FOODIE-WORLD@gmail.com</p>
