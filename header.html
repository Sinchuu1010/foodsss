<!DOCTYPE html>
<html>

<head>
    <title>FOODIE- WORLD</title>

    <style>

        body {
            margin: 0;
            font-family: Arial;
        }

        .header {
            height: 150px;
            background-color:#d35400;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 30px;
        }

        .logo{
            width: 90px;
            height: 90px;
            border-radius: 60%;
            margin-right: 25px;
        }

        h1 {
            margin: 0;
            font-size: 32px;
            color: #fff8f0;

        }

        p {
            font-size: 20px;
            color: black;
        }

        /* SEARCH */

        .search {
            margin-left: auto;
            display: flex;
            align-items: center;
        }

        .search input {
            width: 300px;
            height: 42px;
            border: none;
            border-radius: 25px;
            padding: 0 18px;
            font-size: 14px;
        }

        .search button {
            margin-left: -45px;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: #F0662C;
            font-size: 20px;
            cursor: pointer;
        }

        /* LOGIN & CART */

        .login,
        .cart {
            margin-left: 35px;
            font-size: 17px;
            white-space: nowrap;
        }

    </style>

</head>

<body>

    <!-- ================= HEADER ================= -->

    <div class="header">

        <img src="C:\Users\Kamadhenu BCA\Downloads\sam\websitefolder\logomain.jpeg"
             class="logo">

        <div>
            <h1>FOODIE WORLD</h1>
            <p>Good  Food • Good Mood </p>
        </div>

        <div class="search">
            <input type="text" placeholder="Search for products....">
            <button>🔍</button>
        </div>

        <div class="login">
            👤 Login
        </div>

        <div class="cart">
            🛒 Cart
        </div>

    </div>

</body>

</html>
